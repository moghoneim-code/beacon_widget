name: beacon_widget
description: >-
  Tap a widget in your running Flutter app and get its file:line, theme
  properties and geometry on your clipboard, ready to paste into an AI coding
  agent.
version: 0.2.0
repository: https://github.com/moghoneim-code/beacon_widget
issue_tracker: https://github.com/moghoneim-code/beacon_widget/issues
topics:
  - devtools
  - debugging
  - developer-tools
  - ai

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

# The desktop-side bridge, run with:
#   dart run beacon_widget:bridge --vmservice-out-file=.ref/vm.json
executables:
  bridge:

dependencies:
  flutter:
    sdk: flutter
  no_screenshot: ^1.2.0
  # Used only by the bridge (lib/bridge.dart, bin/bridge.dart), which runs on
  # your development machine — never in the widget tree. They're regular
  # dependencies rather than dev_dependencies because `dart run
  # beacon_widget:bridge` has to resolve them from the consuming project.
  # meta is capped at what the Flutter SDK pins (1.17.0) — a tighter
  # constraint here makes the package unresolvable in any Flutter project.
  # Only @visibleForTesting is used, which predates all of this.
  meta: ^1.17.0
  path: ^1.9.0
  vm_service: ^15.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
