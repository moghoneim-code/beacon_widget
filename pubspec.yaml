name: beacon_widget
description: >-
  Tap a widget in your running Flutter app and get its file:line, theme
  properties and geometry on your clipboard, ready to paste into an AI coding
  agent.
version: 0.1.1
repository: https://github.com/moghoneim-code/beacon_widget
issue_tracker: https://github.com/moghoneim-code/beacon_widget/issues
topics:
  - devtools
  - debugging
  - developer-tools
  - ai

environment:
  sdk: ^3.10.8
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  no_screenshot: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

